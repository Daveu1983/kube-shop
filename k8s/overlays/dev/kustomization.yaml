apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: kube-shop

resources:
  - ../../base
  - namespace.yaml

patches:
  - target:
      kind: Deployment
      labelSelector: app.kubernetes.io/part-of=kube-shop
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
  - target:
      kind: Service
      name: frontend
    patch: |-
      - op: add
        path: /spec/type
        value: NodePort
